name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: {name: build-log, path: build_output.log}
      - run: find app/build/outputs -name "*.apk" | head; ls -la app/build/outputs/apk/debug 2>/dev/null || echo no-debug-dir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdroid-debug-apk
          path: app/build/outputs/**/*.apk
