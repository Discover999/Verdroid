name: Build APK
on:
  push:
    branches: [l10n-zh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdroid-debug-apk
          path: app/build/outputs/**/*.apk
      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: l10n-zh-build
          name: Verdroid debug build (zh-CN)
          files: app/build/outputs/**/*.apk
          make_latest: false
          body: |
            Automated debug build of the l10n-zh branch (Chinese UI + in-app language switcher).
            ⚠️ Debug signature — install over previous debug builds only.
